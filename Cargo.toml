[workspace]
members = ["framecode", "camfarm", "camcheck"]
resolver = "2"

[workspace.package]
version = "1.0.0-rc.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/torkeldanielsson/camfarm"

# a panic in the render or push thread must stop camfarm, not leave it serving cameras without pictures
[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
