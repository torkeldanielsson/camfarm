[package]
name = "camcheck"
description = "Reads camfarm pictures (RTSP, GStreamer CUDA IPC exports, or a recorded grid) and checks every frame's code"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
framecode = { path = "../framecode" }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
gstreamer = { version = "0.25", features = ["v1_20"] }
gstreamer-app = { version = "0.25", features = ["v1_20"] }
gstreamer-video = { version = "0.25", features = ["v1_20"] }
libloading = "0.8"
